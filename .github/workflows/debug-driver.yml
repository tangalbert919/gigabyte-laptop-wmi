name: Release driver (debug)

on:
  push

jobs:
  build:
    name: Generate driver tar file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Generate archive
        run: |
          sed -e "s/@PKGVER@/0.1.0/" -i dkms.conf
          tar -czf driver.tar.gz Makefile aorus-laptop.c dkms.conf
      - name: Upload artifact
        id: create_release
        uses: actions/upload-artifact@v7
        with:
          name: driver.tar.gz
          path: driver.tar.gz

  publish:
    name: Publish driver
    runs-on: ubuntu-latest
    needs: build
    container:
      image: fedora:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist: fc44
            target: fedora-44-x86_64
            arch: x86_64
            version: 44
          - dist: fc43
            target: fedora-43-x86_64
            arch: x86_64
            version: 43
          - dist: fc42
            target: fedora-42-x86_64
            arch: x86_64
            version: 42
    permissions: write-all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download driver
        uses: actions/download-artifact@v8
        with:
          name: driver.tar.gz
      - name: Build RPM
        uses: ./.github/actions/build-rpm
        id: rpm
        with:
          dist: ${{ matrix.dist }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          version: ${{ matrix.version }}

